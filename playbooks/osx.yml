- hosts: 127.0.0.1
  connection: local
  tasks:
    - name: Include Variables
      include_vars: osx_vars.yml
      tags: 
        - include_vars

    - name: Get User
      command: whoami
      register: username
      tags:
        - get_user_name
      changed_when: False

    - debug:
        msg: "[I] Current User: {{ username.stdout }}"
      tags:
        - get_user_name

### Files and Dirs ###
    - name: Create directories
      file:
        path: "~/{{ item }}"
        state: directory
      loop: "{{ directories|flatten(levels=1) }}"
      tags: 
        - create_directories

    - name: Copy Docker Config.json for Credential Helper
      copy:
        dest: "~/.docker/config.json"
        src: files/docker-config.json
        owner: "{{ username.stdout }}"
        mode: 0744
      tags:
        - copy_docker_config_json
          
    - name: Tap Homebrew repositories
      homebrew_tap:
        name: "{{ item }}"
        state: present
      loop: "{{ homebrew_repos|flatten(levels=1) }}"
      tags:
        - tap_homebrew

    - name: Trust tapped Homebrew repositories
      command: brew trust --tap {{ item }}
      register: brew_trust_result
      changed_when: "'Already trusted' not in brew_trust_result.stdout"
      loop: "{{ homebrew_repos|flatten(levels=1) }}"
      tags:
        - tap_homebrew

### Installs ###
    - name: Install tools with homebrew
      homebrew:
        name: "{{ item }}"
        state: present
      loop: "{{ homebrew_tools|flatten(levels=1) }}"
      tags:
        - install_homebrew_tools

    - name: Install homebrew casks
      homebrew_cask:
        name: "{{ item }}"
        state: installed
      loop: "{{ homebrew_casks|flatten(levels=1) }}"
      tags:
        - install_homebrew_casks

    - name: Check if Homebrew Python's pyexpat module is importable
      command: python3 -c "import pyexpat"
      register: pyexpat_check
      changed_when: false
      failed_when: false
      tags:
        - fix_homebrew_python_pyexpat

    # Homebrew's python@3 bottles link pyexpat against macOS's system
    # libexpat on Sequoia+, but some macOS libexpat builds are missing a
    # symbol (XML_SetAllocTrackerActivationThreshold) the bottle expects,
    # breaking pyexpat (and therefore pip/ensurepip) entirely. Repoint the
    # extension at Homebrew's own expat, which has the symbol.
    - name: Work around missing libexpat symbol in Homebrew Python
      when: pyexpat_check.rc != 0
      tags:
        - fix_homebrew_python_pyexpat
      block:
        - name: Locate active Homebrew Python's pyexpat extension
          shell: find -L "$(brew --prefix python3)" -name 'pyexpat*.so' | head -n1
          args:
            executable: /bin/bash
          register: pyexpat_so
          changed_when: false

        - name: Get Homebrew expat prefix
          command: brew --prefix expat
          register: expat_prefix
          changed_when: false

        - name: Repoint pyexpat at Homebrew's expat
          command: >
            install_name_tool -change /usr/lib/libexpat.1.dylib
            {{ expat_prefix.stdout }}/lib/libexpat.1.dylib {{ pyexpat_so.stdout }}

        - name: Re-sign patched pyexpat extension
          command: codesign --sign - --force {{ pyexpat_so.stdout }}

    - name: Install pip packages into tools virtualenv
      pip:
        name: "{{ item }}"
        virtualenv: "~/.venvs/tools"
        virtualenv_command: "python3 -m venv"
      loop: "{{ pip_tools|flatten(levels=1) }}"
      tags:
        - install_pip_tools

    - name: Create default3 virtualenv for Neovim Python3 provider
      pip:
        name: pynvim
        virtualenv: "~/virtualenv/default3"
        virtualenv_command: "python3 -m venv"
      tags:
        - install_pip_tools

    - name: Clone Config Repo
      git:
        repo: "{{ item }}"
        dest: "~/.cfg"
        clone: yes
        bare: yes
        update: yes
      loop:
        - 'git@github.com:the-real-cphillips/config.git'
      notify:
        - Source Config
        - Install TPM Plugins
      tags:
        - clone_config

    - name: Install Plugins/Tools From Git
      git:
        repo: "{{ item.repo_url }}"
        dest: "{{ item.dest }}"
        update: yes
      loop: "{{ git_tools }}"
      tags:
        - install_from_git

    - name: Build vimrc with plugins
      template:
        src: templates/vimrc.j2
        dest: "~/.vimrc"
        owner: "{{ username.stdout }}"
        mode: 0744
      notify:
        - Install Vim Plugins

### Handlers ###
  handlers:
    - name: Source Config
      command: "{{ playbook_dir }}/../dotfiles.sh"

    - name: Install TPM Plugins
      command: "{{ ansible_env.HOME }}/.tmux/plugins/tpm/bin/install_plugins"

    - name: Install Vim Plugins
      command: vim +PlugInstall +qall
